[workspace]
members = ["zodiac-gui"]
# The vendored fork is a path dependency, deliberately not a member: its
# lib.rs carries doy's #![warn(clippy::cargo/pedantic/nursery)] headers,
# which under the gate's -D warnings would fail on publish-metadata
# pedantry for a crate that is never published. It still builds with the
# workspace and is exercised by the golden + audit suites.
exclude = ["vendor/vt100"]

[package]
name = "zodiac"
version = "0.1.0"
edition = "2021"
description = "Terminal multiplexer built around AI coding agents"
license = "MIT"
repository = "https://github.com/pr0vId3nce/zodiac"
authors = ["Destin Allen"]
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "agents", "claude"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.8"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
vt100 = { path = "vendor/vt100" }

[dev-dependencies]
# tests/audit.rs captures the vendored vt100's debug log to prove corpus
# replays stay free of unhandled-sequence noise (ADR 0001).
log = "0.4"

# Workspace-wide (member profiles are ignored by cargo anyway).
[profile.release]
lto = true
strip = true

# Release speed, but with symbols — `strip = true` above leaves a profile with
# no symbol table, which is exactly what blocked attributing the GUI's CPU burn
# to named frames (see zodiac-gui/HANDOFF.md). Build with
# `cargo build --profile profiling -p zodiac-gui`, then `perf top -p $(pidof
# zodiac-gui)`.
[profile.profiling]
inherits = "release"
strip = false
debug = true
