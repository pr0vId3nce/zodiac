[package]
name = "zodiac"
version = "0.1.0"
edition = "2021"
description = "TUI agent multiplexer: a pen for your agents"

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
vt100 = { path = "vendor/vt100" }

[profile.release]
lto = true
strip = true
