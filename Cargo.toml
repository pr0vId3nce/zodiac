[package]
name = "zodiac"
version = "0.1.0"
edition = "2021"
description = "Terminal multiplexer built around AI coding agents"
license = "MIT"
repository = "https://github.com/pr0vId3nce/zodiac"
authors = ["Destin Allen"]
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "agents", "claude"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.8"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
vt100 = { path = "vendor/vt100" }

[profile.release]
lto = true
strip = true
