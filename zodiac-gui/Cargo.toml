[package]
name = "zodiac-gui"
version = "0.1.0"
edition = "2021"
description = "GUI client for zodiac (roadmap Phase 3) — third client on the session socket"
license = "MIT"
repository = "https://github.com/pr0vId3nce/zodiac"
readme = "README.md"
keywords = ["terminal", "gui", "agents"]
categories = ["gui"]

[dependencies]
zodiac = { path = ".." }
anyhow = "1"
# Same crossterm/vt100 as the zodiac lib — client_core's encode_key /
# encode_mouse signatures use their types directly.
crossterm = "0.28"
vt100 = { path = "../vendor/vt100" }
serde_json = "1"
# Pinned per docs/decisions/0004-gui-stack.md.
winit = "=0.30.13"
wgpu = "=30.0.0"
glyphon = "=0.12.0"
# Native GUI toolkit (ADR 0006): egui 0.36 tracks wgpu 30 exactly, so it
# shares our surface and the kitty renderer stays intact. egui owns the
# seven chrome/widget screens; the grid renderer becomes "terminal mode".
egui = "=0.36.1"
egui-wgpu = "=0.36.1"
egui-winit = { version = "=0.36.1", default-features = false, features = ["wayland", "x11"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# First pixel decode in zodiac: T_GFX_IMG payloads (format 100 = PNG,
# 24/32 = raw, optional zlib wrap).
png = "0.17"
flate2 = "1"
# Pair-phone QR (task #29): same pin as the zodiac lib.
qrcode = { version = "0.14.1", default-features = false }
# OSC 52 write-through (roadmap 4.7): T_CLIPBOARD -> system clipboard.
# Text-only (no image-data feature — that drags the whole `image` stack);
# wayland-data-control keeps the primary path off X11 emulation.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Native macOS menu bar (winit has no menu support). Versions match what
# the macOS graph already resolves via arboard/winit, so this adds no new
# objc2 copy — see Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
